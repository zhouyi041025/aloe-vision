[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aloe-vision"
version = "0.1.0"
description = "芦荟植株检测与炭疽病斑分割：基于 YOLOv11 的改进模型开源复现（毕业设计核心代码）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhou Yi (周意)" }]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "pillow",
    "pyyaml",
    "ultralytics>=8.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
bench = ["thop>=0.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 慢速集成测试（含端到端训练/推理冒烟），本机手动运行，CI 默认排除",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
