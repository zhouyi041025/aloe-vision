# aloe-vision · AloeDet：芦荟植株检测与计数模型（改进 YOLOv11n）
# 改进点（对应毕业论文 5.3.2）：
#   1. 骨干与颈部 C3k2 全部替换为 C3k2-Faster（PConv + 1×1 轻量化）
#   2. 骨干末端（P5）插入 MCA 多维协作注意力
#   3. 颈部替换为 BiFPN 加权双向特征融合（Concat + BiFPN_Fusion，含同层对齐捷径）
# 说明：自定义模块通过 aloe_vision.registry.register() 注册后即可被 ultralytics 解析。

nc: 2 # 类别数：0=正常植株 normal，1=倒伏植株 lodged（可自行修改）
scales:
  n: [0.50, 0.25, 1024] # [depth, width, max_channels]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_Faster, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_Faster, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_Faster, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_Faster, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, MCA, [1024]] # 11 骨干末端 MCA 注意力（通道保持）

head:
  # ---- BiFPN 自顶向下 ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [-1, 1, Conv, [512, 1, 1]] # 13 对齐卷积：P5 上采样特征对齐到 P4 通道（256→128）
  - [[-1, 6], 1, Concat, [1]] # 14 融合 P4（128+128）
  - [-1, 1, BiFPN_Fusion, [512]] # 15 加权融合（fast normalized fusion）→128
  - [-1, 2, C3k2_Faster, [512, False]] # 16 T4（128）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 4], 1, Concat, [1]] # 18 融合 P3（128+128）
  - [-1, 1, BiFPN_Fusion, [512]] # 19 →128
  - [-1, 2, C3k2_Faster, [256, False]] # 20 P3/8-small 输出（64）

  # ---- BiFPN 自底向上（同层捷径直连）----
  - [-1, 1, Conv, [512, 3, 2]] # 21 下采样并直接对齐到 T4 通道（64→128）
  - [[-1, 16], 1, Concat, [1]] # 22 与 T4 同层捷径融合（128+128）
  - [-1, 1, BiFPN_Fusion, [512]] # 23 →128
  - [-1, 2, C3k2_Faster, [512, False]] # 24 P4/16-medium 输出（128）

  - [-1, 1, Conv, [1024, 3, 2]] # 25 下采样（128→256）
  - [[-1, 11], 1, Concat, [1]] # 26 与骨干 P5（MCA 输出）融合（256+256）
  - [-1, 1, BiFPN_Fusion, [1024]] # 27 →256
  - [-1, 2, C3k2_Faster, [1024, True]] # 28 P5/32-large 输出（256）

  - [[20, 24, 28], 1, Detect, [nc]] # 29 Detect(P3, P4, P5)
