# aloe-vision · AloeSeg：芦荟炭疽病斑分割与五级分级模型（改进 YOLOv11n-seg）
# 改进点（对应毕业论文 5.3.3）：
#   1. DE 注意力：骨干末端 + 四个分割检测头前端
#   2. 颈部各 C3k2 模块加入 DCNv2 可变形卷积（C3k2_DCN）
#   3. 新增 P2 小目标检测头（P2–P5 四尺度）
#   4. 轻量化分割检测头（构建后自动把 3×3 卷积替换为 PConv + 1×1，抵消 P2 参数增长）

nc: 1 # 类别：炭疽病斑 lesion
aloe_light_head: true # 触发轻量化分割检测头（compat.lighten_segment_head）
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, DEAttention, [1024]] # 11 骨干末端 DE 注意力（通道保持）

head:
  # ---- 自顶向下：P5 → P4 → P3 → P2 ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [-1, 1, Conv, [512, 1, 1]] # 13 对齐到 P4 通道（256→128）
  - [[-1, 6], 1, Concat, [1]] # 14 融合 P4（128+128）
  - [-1, 1, BiFPN_Fusion, [512]] # 15 →128
  - [-1, 2, C3k2_DCN, [512, False]] # 16 T4（128，含 DCNv2）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 4], 1, Concat, [1]] # 18 融合 P3（128+128）
  - [-1, 1, BiFPN_Fusion, [512]] # 19 →128
  - [-1, 2, C3k2_DCN, [256, False]] # 20 T3（64）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21
  - [-1, 1, Conv, [128, 1, 1]] # 22 对齐到 P2 通道（64→32）
  - [[-1, 1], 1, Concat, [1]] # 23 融合 P2（32+32）
  - [-1, 1, BiFPN_Fusion, [128]] # 24 →32
  - [-1, 2, C3k2_DCN, [128, False]] # 25 B2（32，P2/4 小目标特征）

  # ---- 自底向上：P2 → P3 → P4 → P5 ----
  - [-1, 1, Conv, [256, 3, 2]] # 26 下采样（32→64）
  - [[-1, 20], 1, Concat, [1]] # 27 与 T3 融合（64+64）
  - [-1, 1, BiFPN_Fusion, [256]] # 28 →64
  - [-1, 2, C3k2_DCN, [256, False]] # 29 B3（64）

  - [-1, 1, Conv, [512, 3, 2]] # 30 下采样（64→128）
  - [[-1, 16], 1, Concat, [1]] # 31 与 T4 融合（128+128）
  - [-1, 1, BiFPN_Fusion, [512]] # 32 →128
  - [-1, 2, C3k2_DCN, [512, False]] # 33 B4（128）

  - [-1, 1, Conv, [1024, 3, 2]] # 34 下采样（128→256）
  - [[-1, 11], 1, Concat, [1]] # 35 与骨干 P5（DE 输出）融合（256+256）
  - [-1, 1, BiFPN_Fusion, [1024]] # 36 →256
  - [-1, 2, C3k2_DCN, [1024, True]] # 37 B5（256）

  # ---- 分割头前端的 DE 注意力（每个检测头前端一个）----
  - [25, 1, DEAttention, [128]] # 38 P2 分支（32）
  - [29, 1, DEAttention, [256]] # 39 P3 分支（64）
  - [33, 1, DEAttention, [512]] # 40 P4 分支（128）
  - [37, 1, DEAttention, [1024]] # 41 P5 分支（256）

  - [[38, 39, 40, 41], 1, Segment, [nc, 32, 256]] # 42 Segment(P2, P3, P4, P5)
